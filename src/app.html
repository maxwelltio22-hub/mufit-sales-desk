<title>MUFIT Sales Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky scoreboard header with tabs; one working view at a time; lead editor slides in from the right (full screen on phones). */
:root{
  --bg:#FBF6F3; --surface:#FFFFFF; --sunk:#F4EAE4; --line:#E8D8CF;
  --fg:#231713; --muted:#6E5B52; --accent:#C2421D; --accent-ink:#FFFFFF; --accent-soft:#FCE5DA; --logo:#D84D26;
  --hot:#B4235A; --hot-soft:#FBE0EA; --warn:#A16207; --warn-soft:#FBF0CC; --bad:#B42318; --bad-soft:#FBE1DE; --cool:#3B5B8C; --cool-soft:#E0E8F5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16100D; --surface:#201814; --sunk:#2A1F1A; --line:#3B2C25;
  --fg:#F3EAE5; --muted:#B3A097; --accent:#F27A4E; --accent-ink:#1C0B04; --accent-soft:#40221A; --logo:#EE6A3F;
  --hot:#F278A6; --hot-soft:#3A1726; --warn:#E5B544; --warn-soft:#352B12; --bad:#F27466; --bad-soft:#3A1A17; --cool:#8FB0E6; --cool-soft:#1B2638; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16100D; --surface:#201814; --sunk:#2A1F1A; --line:#3B2C25;
  --fg:#F3EAE5; --muted:#B3A097; --accent:#F27A4E; --accent-ink:#1C0B04; --accent-soft:#40221A; --logo:#EE6A3F;
  --hot:#F278A6; --hot-soft:#3A1726; --warn:#E5B544; --warn-soft:#352B12; --bad:#F27466; --bad-soft:#3A1A17; --cool:#8FB0E6; --cool-soft:#1B2638; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}.brand .logo{width:44px;height:auto;flex:none}
.bossonly{display:none}.roplan #tgtEdit,.roplan .tp .btn,.roplan .btn.primary,.roplan .grid2{display:none!important}.roplan input,.roplan .tlead{pointer-events:none}.roplan .tlead{cursor:default}.pvbar{display:none}body.preview .pvbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:13px}body.boss .owneronly{display:none}body.boss .bossonly{display:inline-flex}body.boss #nav a:not(.bossonly),body.boss #pasteLi,body.boss #addLead,body.boss .gs,body.boss #sync{display:none!important}
.btk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.btk:first-of-type{border-top:0}.btk input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.btx{flex:1;min-width:0}.btx b{display:block}.btx p{margin:2px 0;font-size:13px}.btx small{color:var(--muted);font-size:12px}.btx .red{color:var(--bad);font-weight:600}.brep{color:var(--accent)}
.btk.done .btx b{text-decoration:line-through;color:var(--muted)}.bdot{width:10px;height:10px;border-radius:50%;background:var(--warn);margin-top:5px;flex:none}.bdot.ok{background:var(--accent)}.bdot.bad{background:var(--bad)}
.bper [hidden]{display:none!important}.funnel{display:flex;flex-direction:column;gap:8px}.fn-row{display:grid;grid-template-columns:130px 1fr 48px 44px;gap:10px;align-items:center;font-size:13px}.fn-track{background:var(--sunk);border-radius:6px;height:22px;overflow:hidden}.fn-bar{height:100%;background:var(--accent);border-radius:6px}.fn-row b{font-family:var(--display);font-size:18px;text-align:right}.fn-row small{color:var(--muted);text-align:right}@media(max-width:520px){.fn-row{grid-template-columns:96px 1fr 36px 38px;gap:6px}}
.bper{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}.bper .seg{display:flex;gap:6px;margin:0}.bper .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.bper .quick{display:flex;align-items:center;gap:8px}.bdash{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.bform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.tile .cmp{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.brand small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--accent)} .dot.bad{background:var(--bad)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav a{padding:9px 12px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
.count{font-family:var(--display);font-size:15px;background:var(--sunk);border-radius:99px;padding:0 7px;color:var(--fg)}
.count.red{background:var(--bad);color:#fff}
a.btn{text-decoration:none;color:var(--fg)}a.btn.primary{color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
main{padding-block:18px 60px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.sub{color:var(--muted);margin:4px 0 0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.hot{background:var(--hot-soft);color:var(--hot)}
.chip.warm{background:var(--warn-soft);color:var(--warn)}
.chip.cold{background:var(--cool-soft);color:var(--cool)}
.chip.late{background:var(--bad-soft);color:var(--bad)}
.chip.today{background:var(--accent-soft);color:var(--accent)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.st i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.seg .dbtab{margin-left:auto;border-style:dashed}.seg{margin-bottom:8px}.seg .count{font-size:13px;margin-left:2px}.seg button[aria-pressed="true"] .count{background:var(--bg);color:var(--fg)}
.flow{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.li-act{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ctr{display:flex;flex-direction:column;gap:6px}.ctr>span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ctr b{font-family:var(--display);font-size:28px;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.ctr .quick{align-items:center}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
/* Hari ini */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left}
.tile b{display:block;font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tile.alert b{color:var(--bad)}
button.tile:hover{border-color:var(--accent)}
.group{margin-bottom:22px}
.group h2{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) 210px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row.late{border-left-color:var(--bad)} .row.due,.row.new{border-left-color:var(--accent)} .row.soon{border-left-color:var(--warn)}
.row .who b{display:block}
.row .who small,.row .what small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .act{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.btn.danger{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.rank{margin-top:28px;padding-top:18px;border-top:2px solid var(--line)}.rank-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}.rank-h h2{margin:0}
.row .what small b{color:var(--fg);font-weight:600}
.chip.prio{background:var(--fg);color:var(--bg)}
.btn.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.fu-help{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:4px 0 12px;flex-wrap:wrap}.fu-help .sub{flex:1;min-width:240px}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr);gap:8px;padding:10px 12px}.row .act{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.row .act>*{justify-content:center;text-align:center;padding:8px 4px;white-space:normal;line-height:1.2;min-height:36px}.row .act [data-fu-done]{grid-column:span 2;order:-1}.row .who b{white-space:normal}}
/* HP: header ringkas & ikut scroll, tab di bawah layar */
@media (max-width:640px){
 header{position:static}
 .bar{gap:8px;padding-block:8px}
 .brand{font-size:18px;flex:1 1 auto;min-width:0}.brand .logo{width:34px}.brand small{display:none}
 .bar>.spacer{display:none}
 #sync{order:2}#sync span:not(.dot){display:none}
 #logoutBtn{order:3;padding:6px 8px}
 #importBtn,#pvBoss{display:none!important}
 .gs{order:4}
 #pasteLi,#addLead{order:5;flex:1 1 0;justify-content:center;padding:9px 8px;font-size:13.5px}
 nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06);padding:0 6px env(safe-area-inset-bottom,0px);gap:0}
 nav#nav a{flex:1 0 auto;flex-direction:column;gap:2px;padding:8px 10px 7px;font-size:12px;border-bottom:0;border-top:3px solid transparent;justify-content:center}
 nav#nav a[aria-current="page"]{border-top-color:var(--accent);color:var(--accent)}
 nav#nav a .count{font-size:10.5px;padding:0 6px}
 body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
 .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
 h1{font-size:24px}
 .head{margin-bottom:12px}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:10px 12px}.tile b{font-size:24px}
 .fu-help .sub{min-width:0}
 .drawer{width:100%}
}
/* Kanban */
.board-scroll{overflow-x:auto;padding-bottom:10px;margin-inline:-4px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:10px;padding-inline:4px;align-items:start}
.col{background:var(--sunk);border-radius:var(--r);padding:8px;min-height:120px}
.col.drop{outline:2px dashed var(--accent)}
.col h3{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.04em;margin:2px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.cards{display:flex;flex-direction:column;gap:6px;max-height:65vh;overflow-y:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card b{display:block;font-size:13.5px}
.card small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.more{font-size:12px;color:var(--muted);text-align:center;padding:6px}
/* Table */
.table-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--sunk)}
td small{color:var(--muted);display:block}
.num{font-variant-numeric:tabular-nums}
/* Dashboard */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel h2{margin-bottom:10px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px}
.bar-track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.conv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.conv div{border-top:3px solid var(--accent);padding-top:6px}
.conv b{font-family:var(--display);font-size:28px;display:block;line-height:1}
.conv span{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.d-head h1{font-size:26px}
.d-body{overflow-y:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:16px}
.d-foot{display:flex;gap:8px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{color:var(--fg);font-weight:400;font-size:14px;width:100%}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:600}
.stages button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.hist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.hist div{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:5px}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums}
.preview{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px;font-size:13.5px;max-height:220px;overflow-y:auto}
.contact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.contact code{font-family:inherit;background:var(--sunk);padding:2px 6px;border-radius:5px;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-weight:600;font-size:13px}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--bad)}
[data-rid] a{color:var(--accent)}
td.det{font-size:12.5px;line-height:1.5;min-width:280px}td.det>div{margin:2px 0}
.plan{margin-bottom:20px}.plan-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.plan-h h2{margin:0}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0 6px}
.goals>div{display:flex;flex-direction:column;gap:4px}.goals span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.goals b{font-family:var(--display);font-size:24px}.goals small{font-size:14px;color:var(--muted);font-family:var(--body)}
.tasks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.tasks li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 0;border-top:1px solid var(--line)}
.tasks li.done .tk b{text-decoration:line-through;color:var(--muted)}
.tk{display:flex;gap:10px;align-items:flex-start;flex:1 1 320px;min-width:0;cursor:pointer}.tk input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.tk span{display:flex;flex-direction:column;gap:2px}.tk b .count{display:inline;margin-left:6px;font-size:13px}.tk small{font-size:12.5px;color:var(--muted)}
.tp{display:flex;align-items:center;gap:8px;flex:0 1 260px}.tp>span{font-size:13px;font-weight:600;min-width:46px}.tp .bar-track{flex:1;min-width:60px}
.tl{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding-left:28px}
.tlead{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:3px 10px;cursor:pointer}.tlead:hover{border-color:var(--accent)}.tlead em{color:var(--bad);font-style:normal;font-weight:600}

.gs{position:relative;flex:1 1 220px;max-width:380px}.gs input{width:100%}
.gres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgb(0 0 0/.12);z-index:30;max-height:60vh;overflow:auto}
.gres button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:9px 12px;border:0;background:none;color:var(--fg);font:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
.gres button:last-child{border-bottom:0}.gres button:hover,.gres button.on{background:var(--bg)}
.gres .gw{flex:1;min-width:0}.gres b{display:block;font-size:13.5px}.gres small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
const STAGES=[
 {k:'cold',n:'LinkedIn (cold)',short:'LinkedIn',c:'#60A5FA',hint:'Sudah membalas reach out di LinkedIn, belum kasih nomor/email. Target: dapat nomor WA/email.'},
 {k:'warm',n:'Warm (ada no/email)',short:'Warm',c:'#2DD4BF',hint:'Sudah kasih nomor/email. Target: ajak ngobrol dan kirim compro.'},
 {k:'ajak',n:'Ajak meeting',short:'Ajak meeting',c:'#34D399',hint:'Follow-up supaya lanjut ke meeting (termasuk undangan webinar).'},
 {k:'meeting',n:'Habis meeting',short:'Habis meeting',c:'#A3E635',hint:'Sudah meeting. Follow-up kabar dan kebutuhannya.'},
 {k:'quotation',n:'Quotation',short:'Quotation',c:'#FACC15',hint:'Ada kebutuhan. Follow-up quotation sampai deal.'},
 {k:'deal',n:'Deal',short:'Deal',c:'#16A34A',hint:'Sudah deal.'},
 {k:'hold',n:'On hold',short:'On hold',c:'#C084FC',hint:'Tertarik tapi nanti. Isi tanggal FU sesuai janji.'},
 {k:'lost',n:'Lost / Kurang cocok',short:'Lost',c:'#F87171',hint:'Tidak lanjut.'}];
const SMAP=Object.fromEntries(STAGES.map(s=>[s.k,s]));
const ACTIVE=['cold','warm','ajak','meeting','quotation'];
const NEXT={cold:'warm',warm:'ajak',ajak:'meeting',meeting:'quotation',quotation:'deal'};
const NEXT_ACTION={warm:'Kirim compro & ajak ngobrol',ajak:'Ajak jadwalkan meeting',meeting:'Follow-up kabar setelah meeting',quotation:'Kirim & follow-up quotation',deal:''};
const TYPES=['Wellness','Sponsorship','Outbound'];
const CALL_STATUS=['Belum call','Tidak diangkat','Dikirim email/nomor','Tertarik','Tidak tertarik'];
const TEMPLATES=[
 {k:'intro',n:'Intro LinkedIn',t:'Halo {sapaan} {nama}, terima kasih sudah terhubung 🙏\n\nSaya {saya} dari MUFIT Indonesia. Kami bantu perusahaan menjalankan program corporate wellness yang terintegrasi lewat aplikasi: kelas olahraga, konsultasi nutrisi, dukungan kesehatan mental, sampai pemantauan hasil BCM & Mini MCU karyawan.\n\nBoleh saya tahu, di {perusahaan} saat ini sudah ada program wellness untuk karyawan, {sapaan}?'},
 {k:'fu1',n:'Follow-up 1 (H+3)',t:'Halo {sapaan} {nama}, semoga minggu ini lancar ya. Saya mau follow-up pesan sebelumnya. Banyak tim HR yang kami ajak ngobrol sedang mencari cara menekan klaim kesehatan dan meningkatkan engagement karyawan. Kalau {sapaan} berkenan, saya bisa kirimkan company profile singkat kami.'},
 {k:'fu2',n:'Follow-up 2 (H+7)',t:'Halo {sapaan} {nama}, ini pesan terakhir dari saya supaya tidak mengganggu 🙏 Kalau suatu saat {perusahaan} sedang merencanakan program wellness atau MCU, saya siap bantu. Boleh juga diarahkan ke rekan yang memegang program ini.'},
 {k:'minta',n:'Minta kontak',t:'Terima kasih atas balasannya, {sapaan} {nama}. Supaya lebih mudah, boleh saya minta nomor WhatsApp atau email {sapaan}? Saya kirimkan company profile dan contoh program yang pernah kami jalankan.'},
 {k:'compro',n:'Kirim compro (WA)',t:'Selamat {waktu} {sapaan} {nama}, saya {saya} dari MUFIT Indonesia. Berikut company profile kami 📎\n\nKalau {sapaan} ada waktu 15 menit minggu ini, saya ingin dengar kebutuhan tim {perusahaan} supaya bisa kami sesuaikan programnya. Kira-kira hari apa yang cocok, {sapaan}?'},
 {k:'wa-reengage',n:'WA belum respons',t:'Selamat {waktu} {sapaan} {nama}, saya {saya} dari MUFIT Indonesia. Mau follow-up pesan saya sebelumnya soal program wellness karyawan untuk {perusahaan}. Apakah ada waktu untuk ngobrol singkat minggu ini, {sapaan}? Kalau bukan {sapaan} yang memegang, boleh saya minta kontak PIC-nya 🙏'},
 {k:'quot',n:'Follow-up proposal/quotation',t:'Halo {sapaan} {nama}, saya mau follow-up proposal/quotation yang kami kirimkan. Apakah ada bagian yang perlu kami sesuaikan dari sisi scope atau budget? Kami siap revisi supaya pas dengan kebutuhan {perusahaan}.'},
 {k:'nurture',n:'Nurture (janji nanti)',t:'Halo {sapaan} {nama}, sesuai obrolan kita sebelumnya, saya follow-up lagi untuk rencana program wellness di {perusahaan}. Apakah sudah ada gambaran timeline dan budgetnya, {sapaan}?'},
 {k:'pic',n:'Cari PIC',t:'Halo {sapaan} {nama}, terima kasih infonya. Boleh saya tahu siapa rekan yang memegang program kesehatan/benefit karyawan di {perusahaan}? Supaya saya bisa menghubungi orang yang tepat.'},
 {k:'meet',n:'Ajak meeting',t:'Selamat {waktu} {sapaan} {nama}, saya {saya} dari MUFIT Indonesia. Boleh kita jadwalkan meeting online sekitar 30 menit minggu ini untuk membahas program wellness karyawan di {perusahaan}? Saya fleksibel menyesuaikan jadwal {sapaan} 🙏'},
 {k:'post',n:'Follow-up habis meeting',t:'Selamat {waktu} {sapaan} {nama}, terima kasih atas waktunya saat meeting kemarin. Saya mau follow-up, apakah ada update dari internal {perusahaan} terkait program yang kita diskusikan? Kalau perlu materi tambahan atau penawaran harga, saya siapkan ya, {sapaan}.'},
 {k:'webinar',n:'Undangan webinar',t:'Selamat {waktu} {sapaan} {nama}, minggu ini MUFIT Indonesia mengadakan webinar online tentang program wellness karyawan. Kami ingin mengundang tim {perusahaan} untuk ikut. Boleh saya kirimkan detail jadwal dan link-nya, {sapaan}?'},
 {k:'sponsor',n:'Sponsorship/Activation',t:'Halo {sapaan} {nama}, saya {saya} dari MUFIT Indonesia. Kami punya program activation bersama komunitas gaya hidup sehat (offline & digital) yang bisa memberi brand {perusahaan} eksposur langsung ke audiens aktif dan sadar kesehatan. Boleh saya kirimkan deck kolaborasinya, {sapaan}?'}];

const S={bossTasks:new Map(),names:{},role:'?',user:null,me_id:'',tasks:new Map(),targets:null,fuReset:'',rstArm:false,lostArm:'',tgtOpen:false,reach:new Map(),rf:{wk:0,st:'',q:'',add:false,cid:'',del:''},daily:new Map(),leads:new Map(),calls:new Map(),db:null,dl:null,loadedL:false,loadedC:false,open:null,
  f:{q:'',stage:'',type:'',source:'',temp:'',nofu:false,sort:'row',dir:-1},pf:{q:'',type:''},cf:{q:'',kind:'',status:''},me:''};
try{S.me=localStorage.getItem('me')||''}catch(e){}
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmt=s=>{if(!s)return '';const [y,m,d]=s.split('-');return +d+' '+BULAN[+m-1]+(y!==String(new Date().getFullYear())?' '+y.slice(2):'')};
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
/* Follow-up: semua lead aktif yang belum di-FU sejak reset muncul di Hari ini; setelah 'Sudah FU' terjadwal ulang (warm/hot 1 minggu, cold 2 minggu / 1 bulan) */
const FU_STAGES=ACTIVE.concat(['hold']);
function fuDone(l){return !!l.lastFu&&l.lastFu>=(S.fuReset||'')}
function needFu(l){if(!l.active||!FU_STAGES.includes(l.stage))return false;return !fuDone(l)||(!!l.nextFu&&l.nextFu<=todayStr())}
function fuWarm(l){return l.temp==='Hot'||['warm','ajak','meeting','quotation'].includes(l.stage)}
function fuOpts(l){return fuWarm(l)?[[7,'1 minggu'],[14,'2 minggu']]:[[14,'2 minggu'],[30,'1 bulan']]}
function fuState(l){if(!l.active||!FU_STAGES.includes(l.stage))return '';if(!fuDone(l))return 'new';const t=todayStr();if(!l.nextFu)return '';if(l.nextFu<t)return 'late';if(l.nextFu===t)return 'due';return ''}
function fuChip(l){const s=fuState(l);if(s==='new')return '<span class="chip today">Belum di-FU</span>';if(!l.nextFu)return '';const cls=s==='late'?'late':s==='due'?'today':'';return `<span class="chip ${cls}">${s==='late'?'Terlambat · ':''}FU ${s==='due'?'hari ini':esc(fmt(l.nextFu))}</span>`}
/* Skor prioritas & deteksi minat (pintar, berbasis aturan, tanpa biaya) */
const POS_RE=[/tertarik|minat|interested/,/\bboleh\b|silak?h?an|sounds good|oke kirim|ok kirim/,/compro|company profile|proposal|penawaran|quotation|pricelist|harga|budget|biaya/,/jadwal|meeting|call|ngobrol|diskusi|zoom|gmeet|ketemu|presentasi/,/butuh|kebutuhan|need|cari vendor|planning|rencana|program/,/kirim(kan)? (ke|via|lewat)? ?(email|wa)|ini (no|nomor|email)|hubungi saya/];
const NEG_RE=[/tidak tertarik|(ga|gak|nggak|enggak) tertarik|not interested|kurang tertarik/,/belum (butuh|perlu|ada (planning|kebutuhan|budget|rencana))/,/(tidak|ga|gak) ada budget|no budget/,/sudah (ada|punya) vendor|sudah kerja ?sama/,/menolak|\btolak|jangan (hubungi|kirim)|unsubscribe|stop/];
const LATER_RE=/januari|februari|desember|\bdes\b|\bjan\b|q1|kuartal|tahun depan|bulan depan|next year|nanti (saja|aja)/;
const SYS_H=/^(pindah list|masuk list|tahap:|sudah di-follow up|kasih |digabung|kirim pesan:|mulai di-follow|ada no\/email|lost:|dipindah|membalas reach out|balasan linkedin|tidak tertarik → lost)/i;
function leadText(l){const r=[...S.reach.values()].filter(x=>x.leadId===l.id).map(x=>x.note||'');return [l.liNote||'',l.liSaran||'',String(l.notes||'').replace(/status lama:[^|]*/ig,''),...(l.history||[]).filter(h=>!SYS_H.test(h.t||'')).slice(-5).map(h=>h.t),...r].join(' \n').toLowerCase()}
function interestOf(l){const t=leadText(l);let p=0,n=0;POS_RE.forEach(re=>{if(re.test(t))p++});NEG_RE.forEach(re=>{if(re.test(t))n++});return {p,n,later:LATER_RE.test(t)}}
function prioOf(l){const t=todayStr(),why=[];let s=({quotation:30,meeting:26,ajak:22,warm:16,hold:6,cold:8})[l.stage]||0;
  const m=+l.liMinat||0;if(m){s+=(m-3)*12;why.push('minat '+m+'/5')}
  if(l.liStatus==='tertarik'){s+=10}else if(l.liStatus==='tidak_tertarik'){s-=25}else if(l.liStatus==='belum_balas'){s-=8;why.push('belum membalas')}
  if(l.liReply){const d=Math.round((new Date(t)-new Date(l.liReply))/864e5);if(d>=0&&d<=3){s+=10;why.push('balas '+(d?d+' hari lalu':'hari ini'))}else if(d<=7)s+=5;else if(d>30){s-=6;why.push('balasan terakhir '+d+' hari lalu')}}
  if(!needFu(l)){s-=20;why.push('sudah di-FU, jadwal '+fmt(l.nextFu||''))}
  if(l.temp==='Hot'){s+=25;why.push('Hot')}else if(l.temp==='Warm')s+=10;else if(l.temp==='Cold')s-=5;
  const I=interestOf(l);if(I.p&&I.p>=I.n){s+=Math.min(18,I.p*6);if(I.p>=2)why.push('respon tertarik')}if(I.n){s-=Math.min(24,I.n*12);why.push('respon kurang tertarik')}if(I.later){s-=6;why.push('minta dihubungi nanti')}
  if(l.phone||l.email)s+=6;
  if(fuState(l)==='late'){const d=Math.round((new Date(t)-new Date(l.nextFu))/864e5);s+=Math.min(20,d*2);why.push('terlambat '+d+' hari')}
  if(l.stage!=='cold'&&l.lastContact){const d=Math.round((new Date(t)-new Date(l.lastContact))/864e5);if(d>=0&&d<=3){s+=8;why.push('baru ada kontak')}}
  if(['quotation','meeting'].includes(l.stage))why.push(SMAP[l.stage].n);
  return {s,why,I}}
function minatChip(I,l){const m=+l.liMinat||0;if(m)return `<span class="chip ${m>=4?'hot':m<=2?'late':''}" title="Dari catatan LinkedIn">Minat ${m}/5</span>`;if(I.n>I.p)return '<span class="chip late" title="Dari isi balasan/catatan">Kurang tertarik</span>';if(I.p>=2||(I.p&&l.temp==='Hot'))return '<span class="chip hot" title="Dari isi balasan/catatan">Tertarik</span>';return ''}
async function markFu(id,days){const l=S.leads.get(id);if(!l)return;const t=todayStr(),nx=addDays(days);await patchLead(id,{lastFu:t,lastContact:t,nextFu:nx,history:[...(l.history||[]),{d:t,t:'Sudah di-follow up. FU berikutnya '+fmt(nx)}]});toast('Tercatat. FU berikutnya '+fmt(nx))}
async function resetFu(){const t=todayStr();S.fuReset=t;S.rstArm=false;render();try{await S.db.doc('settings/fuReset').set({date:t});toast('Jadwal FU di-reset. Semua lead aktif muncul di Hari ini')}catch(e){toast('Gagal reset')}}
function tempChip(t){return t?`<span class="chip ${t.toLowerCase()}">${esc(t)}</span>`:''}
function stChip(k){const s=SMAP[k]||SMAP.warm;return `<span class="st"><i style="background:${s.c}"></i>${esc(s.n)}</span>`}
function waNum(p){let d=String(p||'').split('/')[0].replace(/[^0-9+]/g,'');if(d.startsWith('+'))d=d.slice(1);if(d.startsWith('0'))d='62'+d.slice(1);return d.length>=10&&d.startsWith('628')?d:''}
function fillT(t,l){const h=new Date().getHours();const waktu=h<11?'pagi':h<15?'siang':h<18?'sore':'malam';
  return t.replace(/\{sapaan\}/g,l.sapaan||'Bapak/Ibu').replace(/\{nama\}/g,(l.name||'').split(' ')[0]).replace(/\{perusahaan\}/g,l.company||'perusahaan').replace(/\{saya\}/g,S.me||'[nama kamu]').replace(/\{waktu\}/g,waktu)}
function setSync(state,text){const el=$('#sync');el.innerHTML=`<span class="dot ${state}"></span><span>${esc(text)}</span>`}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Disalin')}catch(e){toast('Tidak bisa menyalin otomatis, blok teksnya lalu salin manual')}}

/* ---------- DB ---------- */
async function boot(){
  render();
  try{const u=await window.claude?.use?.('user');S.user=u;const ed=u?await u.canEdit():false;S.role=ed?'owner':'boss';if(u&&u.id){try{S.me_id=await u.id()||''}catch(e){}}}catch(e){S.role='boss'}
  document.body.classList.toggle('boss',S.role==='boss');render();
  const pv=on=>{S.role=on?'boss':'owner';document.body.classList.toggle('boss',on);document.body.classList.toggle('preview',on);location.hash=on?'tugas-atasan':'hari-ini';render()};
  if(S.role==='owner'){$('#pvBoss').onclick=()=>pv(true);$('#pvBack').onclick=()=>pv(false)}
  const timer=setTimeout(()=>{if(!S.loadedL)setSync('bad','Data belum bisa dimuat. Cek koneksi.')},10000);
  let db=null;try{db=await window.claude?.use?.('db')}catch(e){}
  if(!db){clearTimeout(timer);setSync('bad','Database tidak tersedia di tampilan ini (login dulu ke claude.ai)');render();return}
  S.db=db;
  db.collection('leads').onSnapshot(snap=>{
    S.leads=mergePend('leads',new Map(snap.docs.map(d=>{const x={id:d.id,...d.data()};if(x.stage==='cold')x.temp='';return [d.id,x]})));GONE.forEach(id=>S.leads.delete(id));S.loadedL=true;
    if(!snap.metadata.fromCache){clearTimeout(timer);setSync('ok','Tersimpan otomatis')}
    render();if(S.open&&S.open.type==='lead'&&!S.open.dirty)refreshDrawer();
    if(S.role==='owner'&&!snap.metadata.fromCache){clearTimeout(S.awT);S.awT=setTimeout(autoWarm,800)}
  },e=>{clearTimeout(timer);setSync('bad','Gagal memuat data ('+e.code+')');S.loadedL=true;render()});
  db.collection('calls').onSnapshot(snap=>{S.calls=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.loadedC=true;if(view()==='cold-call')render()},()=>{S.loadedC=true});
  db.collection('reach').onSnapshot(snap=>{S.reach=mergePend('reach',new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}])));if(['reach-out','dashboard','hari-ini','tugas-atasan','ringkasan'].includes(view()))render();else counts()},()=>{});
  db.collection('inbox').onSnapshot(snap=>{S.inbox=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));if(view()==='reach-out')render()},()=>{});
  db.collection('bossTasks').onSnapshot(snap=>{S.bossTasks=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));render()},()=>{});
  db.collection('tasks').onSnapshot(snap=>{S.tasks=new Map(snap.docs.map(d=>[d.id,d.data()]));if(['hari-ini','tugas-atasan'].includes(view()))render()},()=>{});
  db.collection('settings').onSnapshot(snap=>{const d=snap.docs.find(x=>x.id==='targets');S.targets=d?d.data():null;const r=snap.docs.find(x=>x.id==='fuReset');S.fuReset=r?(r.data().date||''):'';const lr=snap.docs.find(x=>x.id==='liReport');S.liReport=lr?(lr.data().date||''):'';const di=snap.docs.find(x=>x.id==='dupIgnore');S.dupIgnore=di?(di.data().pairs||[]):[];render()},()=>{});
  db.collection('daily').onSnapshot(snap=>{S.daily=new Map(snap.docs.map(d=>[d.id,d.data()]));if(['hari-ini','dashboard','tugas-atasan','ringkasan'].includes(view()))render()},()=>{});
  try{S.dl=await window.claude.use('downloads')}catch(e){}
  try{S.sample=await window.claude.use('sample')}catch(e){}
}
const PEND={leads:new Map(),reach:new Map()};const GONE=new Set();/* lead yang sedang/sudah dihapus: jangan muncul lagi dari snapshot lama */
function mergePend(k,m){PEND[k].forEach((d,id)=>{const sv=m.get(id);if(!sv||(sv.updatedAt||'')<(d.updatedAt||''))m.set(id,d);else PEND[k].delete(id)});return m}
async function withRetry(fn){let e;for(const w of [0,1500,4000]){if(w)await new Promise(r=>setTimeout(r,w));try{return await fn()}catch(x){e=x;if(['quota_exceeded','not_granted','permission_denied'].includes(x&&x.code))break}}throw e}
async function saveLead(l){if(!S.db){toast('Database belum tersambung');return false}
  const {id,...body}=l;body.updatedAt=new Date().toISOString();if(body.stage==='cold')body.temp='';/* Cold LinkedIn: suhu selalu kosong (-) */
  if(body.stage==='cold'&&(String(body.phone||'').trim()||String(body.email||'').trim())){body.stage='warm';body.active=true;body.nextAction=NEXT_ACTION.warm;if(!body.nextFu||body.nextFu>addDays(1))body.nextFu=addDays(1);body.history=[...(body.history||[]),{d:todayStr(),t:'Ada no/email → otomatis pindah ke Warm'}]}
  if(body.stage==='lost'&&!String(body.phone||'').trim()&&!String(body.email||'').trim()){/* Lost tanpa no/email: tidak disimpan di Database, langsung dihapus */
    const prev=S.leads.get(id);GONE.add(id);S.leads.delete(id);PEND.leads.delete(id);if(S.open&&S.open.id===id){S.open=null;$('#drawerHost').innerHTML=''}render();toast((body.name||body.company||'Lead')+': lost permanen (tidak ada no/email)');
    try{await withRetry(()=>S.db.doc('leads/'+id).delete());Promise.all([...S.reach.values()].filter(r=>r.leadId===id).map(r=>saveReach({...r,leadId:''}))).catch(()=>{});return true}catch(e){GONE.delete(id);if(prev){S.leads.set(id,prev);render()}toast('Gagal menghapus, coba lagi');return false}}

(function(){const q=$('#gq'),box=$('#gres');let hits=[],sel=0;

      .sort((a,b)=>(b.active?1:0)-(a.active?1:0)).slice(0,12)};
  const show=()=>{const t=q.value.trim();if(!t){box.hidden=true;return}hits=find(t);sel=0;
    box.innerHTML=hits.length?hits.map((l,i)=>`<button data-gi="${i}" class="${i===sel?'on':''}"><span class="gw"><b>${esc(l.name||l.company)}</b><small>${esc(l.name?l.company:'')}${l.phone?' · '+esc(l.phone):''}${l.email?' · '+esc(l.email):''}</small></span>${stChip(l.stage)}<span class="gt">${l.active?'Di-follow up':(l.row?'Database No '+l.row:'Database')}</span></button>`).join(''):'<div class="none">Tidak ada lead yang cocok.</div>';
    box.hidden=false;box.querySelectorAll('[data-gi]').forEach(b=>b.onmousedown=e=>{e.preventDefault();pick(+b.dataset.gi)})};

    else if(e.key==='Enter'){e.preventDefault();pick(sel)}else if(e.key==='Escape'){box.hidden=true;q.blur()}};

/* ---------- Reach out harian ---------- */
const RS={sent:{n:'Belum balas',c:''},replied:{n:'Membalas',c:'cold'},contact:{n:'Kasih no/email',c:'today'},no:{n:'Menolak',c:'late'}};
const HARI=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function weekDays(off){const d=new Date(todayStr()+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7)+7*off);const a=[];for(let i=0;i<7;i++){a.push(ymd(d));d.setDate(d.getDate()+1)}return a}
const fmtY=s=>{if(!s)return '';const [y,m,d]=s.split('-');return +d+' '+BULAN[+m-1]+' '+y};
const isReply=r=>['replied','contact','no'].includes(r.status);
function weekStats(days){const set=new Set(days);const all=[...S.reach.values()];const it=all.filter(r=>set.has(r.date)&&!r.untracked);
  const replies=all.filter(r=>isReply(r)&&rDays(r).some(d=>set.has(d)));const rep=replies.length,con=replies.filter(r=>r.status==='contact').length,no=replies.filter(r=>r.status==='no').length;
  const shown=[...new Set([...it,...replies])];
  return {it,replies,shown,total:it.length,rep,con,no,wait:it.filter(r=>r.status==='sent').length,rate:it.length?Math.round(rep/it.length*100):0,crate:it.length?Math.round(con/it.length*100):0}}
const rDaysAll=r=>Array.isArray(r.replyDays)&&r.replyDays.length?r.replyDays:(isReply(r)?[r.replyDate||r.date]:[]);
/* satu orang = satu balasan, dihitung di tanggal balasan terbarunya (tidak dobel antar hari) */
const rDays=r=>{const a=rDaysAll(r);return a.length?[a.slice().sort().slice(-1)[0]]:[]};
/* angka harian dari tab Reach out (sumber utama); kalau di tanggal itu belum ada log reach out, pakai angka manual tab Hari ini */
const reachOnDay=d=>{const n=[...S.reach.values()].filter(r=>r.date===d&&!r.untracked).length;return n||((S.daily.get(d)||{}).reach||0)};
const repOnDay=d=>[...S.reach.values()].filter(r=>isReply(r)&&rDays(r).includes(d)).length;
const rDay=r=>rDays(r).slice(-1)[0]||r.date;
const repOn=(arr,d)=>arr.filter(r=>rDays(r).includes(d));
function parseReach(txt){return txt.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(line=>{const um=line.match(/https?:\/\/[^\s]*linkedin\.com\/in\/[^\s,|]+/i);const url=um?um[0]:'';let rest=(url?line.replace(url,''):line).replace(/^\d+[.)]\s*/,'').trim();
  let p=rest.split(/\s+[-–|]\s+|\t|\s*\|\s*/).map(x=>x.trim()).filter(Boolean);let name=p[0]||'',title=p[1]||'',company=p[2]||'';
  if(!company&&/\s(at|di|@)\s/i.test(title)){const m=title.split(/\s(?:at|di|@)\s/i);title=m[0].trim();company=(m[1]||'').trim()}
  if(!name&&url)name=slugName(url);return {name,title,company,linkedin:url}}).filter(r=>r.name)}
async function saveReach(r){if(!S.db){toast('Database belum tersambung');return false}const {id,...b}=r;b.updatedAt=new Date().toISOString();try{await withRetry(()=>S.db.doc('reach/'+id).set(b));S.reach.set(id,{id,...b});PEND.reach.set(id,{id,...b});return true}catch(e){S.saveFails=(S.saveFails||0)+1;toast('Gagal menyimpan, coba lagi');return false}}
async function addReach(rows,date){let ok=0,skip=0;const seen=[];for(const r of rows){/* sudah pernah di-reach out (atau dobel di tempelan ini): lewati */if(findReach(r)||seen.some(x=>(liSlug(x.linkedin)&&liSlug(x.linkedin)===liSlug(r.linkedin))||samePerson(x.name,r.name,x.company,r.company))){skip++;continue}seen.push(r);const id='R'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);if(await saveReach({id,date,status:'sent',replyDate:'',note:'',leadId:'',...r}))ok++}

const nameKey=x=>nrm(x).replace(/(.)\1+/g,'$1');
function lev1(a,b){if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(a.length-i)+(b.length-j)<=1}
function sameName(a,b){const x=nameKey(a),y=nameKey(b);if(x.length<4||y.length<4)return false;if(x===y)return true;return x.length>=10&&y.length>=10&&lev1(x,y)}
function coMatch(a,b){const x=nrm(a),y=nrm(b);return !x||!y||x.includes(y)||y.includes(x)}
const SRANK={deal:7,quotation:6,meeting:5,ajak:4,warm:3,hold:2,cold:1,lost:0};
function leadScore(l){return (SRANK[l.stage]||0)*10+(l.phone?3:0)+(l.email?3:0)+(l.row?2:0)+(l.active?1:0)}
function dupPairs(){const L=[...S.leads.values()],out=[],ign=new Set((S.dupIgnore||[]));
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j];const why=[];
    const pa=phN(a.phone),pb=phN(b.phone);if(pa&&pa===pb)why.push('no HP sama');
    const ea=String(a.email||'').trim().toLowerCase(),eb=String(b.email||'').trim().toLowerCase();if(ea&&ea===eb)why.push('email sama');
    const sa=liSlug(a.linkedin),sb=liSlug(b.linkedin);if(sa&&sa===sb)why.push('LinkedIn sama');
    if(sameName(a.name,b.name)&&coMatch(a.company,b.company))why.push(nameKey(a.name)===nameKey(b.name)?'nama sama':'nama mirip');
    if(!why.length)continue;const k=[a.id,b.id].sort().join('|');if(ign.has(k))continue;
    const [keep,drop]=leadScore(a)>=leadScore(b)?[a,b]:[b,a];out.push({k,keep,drop,why})}
  return out}

    .concat(all.filter(l=>l.source==='LinkedIn'||l.origin==='List LinkedIn (cold)').map(l=>[l.name,l.company,l.title,SMAP[l.stage]?.n||l.stage,l.active?'Ya':'',l.phone,l.email,l.linkedin,l.nextAction,l.nextFu?fmt(l.nextFu):'',l.notes]));
  // Aktivitas harian
  const dk=[...new Set([...S.daily.keys(),...[...S.reach.values()].flatMap(r=>[r.untracked?null:r.date,...rDays(r)]).filter(Boolean)])].sort();const dd=[['Tanggal','Connect dikirim','Reach out dikirim','Balasan masuk']]
    .concat(dk.map(d=>{const x=S.daily.get(d)||{};return [fmt(d),x.connect||0,reachOnDay(d),repOnDay(d)]}));
  // Riwayat
  const since=addDays(-30);const hist=[];all.forEach(l=>(l.history||[]).forEach(h=>{if(h.d>=since)hist.push([h.d,l.name,l.company,h.t])}));
  hist.sort((a,b)=>b[0].localeCompare(a[0]));const hh=[['Tanggal','Nama','Perusahaan','Aktivitas']].concat(hist.map(r=>[fmt(r[0]),r[1],r[2],r[3]]));
  // Cold call
  const cc=[['Nama','Jenis','No telp','Alamat','Status','Catatan']].concat([...S.calls.values()].map(c=>[c.name,c.kind,c.phone,c.address,c.status,c.notes]));
  const wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,s0,'Ringkasan');
  X.utils.book_append_sheet(wb,sheet(fu,[16,24,7,28,18,16,28,7,30,12,10,30,40]),'List follow-up');
  X.utils.book_append_sheet(wb,sheet(db,[5,24,30,20,10,16,28,16,18,12,14,8,30]),'Database');
  X.utils.book_append_sheet(wb,sheet(li,[24,24,20,16,10,16,28,30,26,12,30]),'LinkedIn');
  X.utils.book_append_sheet(wb,sheet(dd,[14,14,16,18]),'Aktivitas harian');
  X.utils.book_append_sheet(wb,sheet(hh,[12,24,28,60]),'Riwayat 30 hari');
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});
  try{await S.dl.save({filename:'Laporan-MUFIT-'+t+'.xlsx',data:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});toast('Laporan Excel disimpan')}
  catch(e){toast(e&&e.code==='declined'?'Download dibatalkan':'Gagal menyimpan file')}
  finally{if(btn){btn.disabled=false;btn.textContent=old}}
}
const normName=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function icpCheck(t){t=(t||'').toLowerCase();if(/(student|mahasiswa|intern|magang|open to work|fresh graduate|looking for)/.test(t))return {ok:false,txt:'Kemungkinan di luar ICP (student/intern/open to work)'};if(/(hr|human|people|talent|recruit|l&d|learning|comp|benefit|reward|ga\b|general affair|personalia|culture|engagement)/.test(t))return {ok:true,txt:'Masuk ICP (HR/TA/L&D/C&B/GA)'};return {ok:null,txt:'Cek jabatannya: ICP = HR, HRGA, TA, L&D, Comp & Ben'}}
function slugName(u){const m=u.match(/linkedin\.com\/in\/([^/?#\s]+)/i);if(!m)return '';return decodeURIComponent(m[1]).split('-').filter(w=>!/\d/.test(w)).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ')}
async function parseLinkedIn(text){const raw=(text.match(/https?:\/\/([a-z]+\.)?linkedin\.com\/in\/[^\s?#]+[^\s]*/i)||[''])[0];const url=raw.replace(/[?#].*$/,'').replace(/\/$/,'');
  const rest=(raw?text.replace(raw,''):text).trim();
  if(rest.length>20&&S.sample){try{const r=await S.sample.json('Ekstrak data dari teks profil LinkedIn di bawah. Balas JSON saja: {"name":"","title":"","company":"","industry":"","location":""}. title = jabatan saat ini, company = perusahaan saat ini. Isi string kosong kalau tidak ada; jangan menebak.\n\nTEKS:\n'+rest.slice(0,6000),{modelTier:'quick'});if(r&&typeof r==='object')return {name:String(r.name||''),title:String(r.title||''),company:String(r.company||''),industry:String(r.industry||''),linkedin:url,via:'ai'}}catch(e){}}
  const lines=rest.split(/\n+/).map(s=>s.trim()).filter(s=>s&&s.length<120);
  const head=lines[1]||'';const at=head.split(/\s+(?:at|di|@)\s+/i);
  return {name:lines[0]||slugName(url),title:at.length>1?at[0]:head,company:at.length>1?at.slice(1).join(' '):'',industry:'',linkedin:url,via:'manual'}}
function openPaste(){S.open={type:'paste'};
  $('#drawerHost').innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="Tempel dari LinkedIn"><div class="d-head"><div style="flex:1"><h1>Tempel dari LinkedIn</h1><p class="sub">Buka profil di LinkedIn, blok dan salin bagian atas profil (nama, jabatan, perusahaan) beserta URL-nya, lalu tempel di sini.</p></div><button class="btn ghost" id="dClose" aria-label="Tutup">✕</button></div>
  <div class="d-body"><section class="sec"><label class="f">Teks profil atau URL<textarea id="liTxt" rows="9" placeholder="https://www.linkedin.com/in/nama-orang\nNama Orang\nHR Manager at PT Contoh Indonesia\nJakarta"></textarea></label><div class="quick"><button class="btn primary" id="liGo">Ambil data</button>${S.sample?'':'<span class="sub" style="margin:0;font-size:12px">Baris 1 = nama, baris 2 = jabatan.</span>'}</div></section><div id="liOut"></div></div></aside>`;
  $('#scrim').onclick=closeDrawer;$('#dClose').onclick=closeDrawer;$('#liTxt').focus();
  $('#liGo').onclick=async()=>{const t=$('#liTxt').value.trim();if(!t){toast('Tempel teks atau URL profil dulu');return}
    const out=$('#liOut');out.innerHTML='<div class="empty">Membaca profil…</div>';const r=await parseLinkedIn(t);
    const dup=[...S.leads.values()].find(l=>(r.linkedin&&l.linkedin&&l.linkedin.replace(/\/$/,'')===r.linkedin)||(r.name&&normName(l.name)===normName(r.name)));
    const icp=icpCheck(r.title);
    out.innerHTML=`<section class="sec"><h2>Hasil</h2><div class="grid2"><label class="f">Nama<input type="text" id="li-name" value="${esc(r.name)}"></label><label class="f">Jabatan<input type="text" id="li-title" value="${esc(r.title)}"></label><label class="f">Perusahaan<input type="text" id="li-company" value="${esc(r.company)}"></label><label class="f">Industri<input type="text" id="li-industry" value="${esc(r.industry)}"></label></div>
      <div class="contact"><span class="chip ${icp.ok===false?'late':icp.ok?'today':''}">${esc(icp.txt)}</span></div>
      ${dup?`<div class="contact"><span class="chip late">Sudah ada: ${esc(dup.name)} · ${esc(dup.company)}</span><button class="btn sm" id="liDup">Buka lead itu</button></div>`:''}
      <div class="quick"><button class="btn primary" id="liMake">${dup?'Tetap buat lead baru':'Buat lead'}</button></div></section>`;
    if(dup)$('#liDup').onclick=()=>openLead(dup.id);
    $('#liMake').onclick=()=>newLead({name:$('#li-name').value.trim(),title:$('#li-title').value.trim(),company:$('#li-company').value.trim(),industry:$('#li-industry').value.trim(),linkedin:r.linkedin,source:'LinkedIn',channels:['LinkedIn'],stage:'cold',nextAction:'Minta nomor WA/email',nextFu:addDays(2),history:[{d:todayStr(),t:'Masuk list LinkedIn (cold): membalas reach out'}]})}}
boot();
</script>
